# conf/model/domain_adapt/wgan.yaml

visual_da:
  _target_: mdt.models.domain_adapt.wgan.WGAN_GP
  in_dim: "512*1,"  # trans_enc:1536, res_perceptual:1024, voltron_perceptual:1152, action_emb:10*512
  ndims: 2
  gamma: 10

action_da:
  _target_: mdt.models.domain_adapt.wgan.WGAN_GP
  in_dim: "1536*6,"  # trans_enc:1536, res_perceptual:1024, voltron_perceptual:1152, action_emb:10*512
  ndims: 2
  gamma: 1
  num_layers: 6  # v:6 layers, k:6 layers
  use_ada: true
  use_cond_dist: false

use_da_visual: 'both'  # static,gripper,both,false
use_da_act: true
