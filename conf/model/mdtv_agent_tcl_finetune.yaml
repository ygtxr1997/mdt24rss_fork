# conf/model/mdtv_agent_tcl_finetune.yaml
_target_: mdt.models.mdtv_agent.MDTVAgentTCL
_recursive_: false

defaults:
  - language_goal: clip
  - visual_goal: clip
  - img_gen: masked_transformer
  - model: mdtv_transformer


latent_dim: 384
multistep: 10
sampler_type: 'ddim'
num_sampling_steps: 10
sigma_data: 0.5
sigma_min: 0.001
sigma_max: 80
noise_scheduler: 'exponential'
sigma_sample_density_type: 'loglogistic'
use_lr_scheduler: true
act_window_size: 10
cont_alpha: 1.0
masked_beta: 1.0
use_distributed_clip: True
use_text_not_embedding: True
ckpt_path: null
seed: ${seed}
perceiver_depth: 6
perceiver_heads: 8
perceiver_dim_head: 64
perceiver_num_time_embeds: 1
perceiver_dim: 384
num_latents: 3
use_proprioception: true  # ori: false

voltron_cache: ${root_home}/pretrained

# Finetuning uses a smaller learning rate
optimizer:
  _target_: torch.optim.AdamW
  transformer_weight_decay: 0.05
  obs_encoder_weight_decay: 0.05
  learning_rate: 5e-5  # ori:1e-4
  betas: [0.9, 0.9]

lr_scheduler:
  lr_scheduler:
    init_lr: 5e-5  # This is the peak or maximum learning rate, ori:1e-4
    init_lr_scale: 0.1  # This is the ratio of initial learning rate to peak learning rate
    final_lr_scale: 5e-7  # This is the ratio of final learning rate to peak learning rate
    total_steps: 10000  # Example total steps, adjust as needed, ori:100000
    phase_ratio: "(0.02, 0.08, 0.9)"
    lr: 5e-5  # ori:1e-4