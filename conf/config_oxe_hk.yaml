# conf/config_oxe_hk.yaml
defaults:
  - _self_
  - callbacks: oxe
  - datamodule: oxe_uha
  - model: mdt_agent_oxe # mdt_agent
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

root_home: /home/geyuan
root_data_dir: ${root_home}/code/mdt24rss_fork/dataset/task_D_D
# just for debug
source_root_data_dir: ${root_home}/code/mdt24rss_fork/dataset/task_ABC_D
target_root_data_dir: ${root_home}/code/mdt24rss_fork/dataset/task_D_D

#lang_folder: lang_clip_resnet50
vis_clip_model_name: ViT-B/16
clip_lang_model_name: ViT-B/32

log_dir: ${root_home}/code/mdt24rss_fork/logs
slurm: false
min_window_size: 21
max_window_size: 50
future_range: 29
seed: 242
device: 'cuda'
batch_size: 128
drop_last: true
pin_memory: true
num_workers: 0
devices: 4
goal_window_size: 1
act_dim: 7
obs_dim: 384
goal_dim: 512
obs_seq_len: 1
act_seq_len: 10
multistep: 10
p_last_state: 0
gen_img_res: 112
max_epochs: 20
rollout_lh_skip_epochs: 0
window_sampling_strategy: 'geometric'
num_tokens_voltron: 3
img_gen_frame_diff: 3
benchmark_name: oxe

trainer:
  gpus: ${devices}
  precision: bf16
  max_epochs: ${max_epochs}
  sync_batchnorm: false
  accelerator: auto
  limit_train_batches: 1000
  limit_val_batches: 4

logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  save_dir: .
  name: logger
  group: edm_dp
  log_model: false
  project: ${benchmark_name} # calvin_vision
  entity: gavinyuan
  id: ???

hydra:
  run:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - log_dir
          - datamodule.root_data_dir
          - trainer.gpus
          - datamodule.num_workers
          - trainer.limit_train_batches
          - trainer.limit_val_batches

