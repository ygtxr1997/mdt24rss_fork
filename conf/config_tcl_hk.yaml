defaults:
  - callbacks: tcl  # ori:calvin
  - datamodule: tcl_merge  # ori:tcl_clear, now:tcl_merge
  - model: mdtv_agent_tcl  # or use mdt_agent, mdt_agent_tcl
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

root_home: /home/geyuan
root_data_dir:
  - ${root_home}/local_soft/TCL/collected_data_0507/
  - ${root_home}/local_soft/TCL/0627_pot_source/
  - ${root_home}/local_soft/TCL/0704_pepper_source/
  - ${root_home}/local_soft/TCL/0709_coffee_source/
## just for debug
#source_root_data_dir: ${root_home}/code/mdt24rss_fork/dataset/task_ABC_D
#target_root_data_dir: ${root_home}/code/mdt24rss_fork/dataset/task_D_D
##
lang_folder: lang_clip_resnet50
vis_clip_model_name: ViT-B/16
clip_lang_model_name: ViT-B/32

#pretrain_chk: "/home/geyuan/code/mdt24rss_fork/logs/runs/2025-07-08/15-56-32/checkpoints/latest.ckpt"
#pretrain_chk: "/home/geyuan/code/mdt24rss_fork/logs/runs/2025-07-08/15-56-32/calvin_d/2025-07-08_15-56-32/checkpoints/epoch=199-step=41800.ckpt"
pretrain_chk: "/home/geyuan/code/mdt24rss_fork/logs/runs/2025-07-16/03-18-21/checkpoints/latest.ckpt"
#pretrain_chk: "/home/geyuan/code/mdt24rss_fork/logs/runs/2025-07-16/00-57-45/checkpoints/model-e375-loss0.0011.ckpt"
log_dir: ${root_home}/code/mdt24rss_fork/logs
slurm: false
min_window_size: 21
max_window_size: 50
future_range: 29
seed: 242
device: 'cuda'
batch_size: 128
devices: 4
goal_window_size: 1
act_dim: 7
obs_dim: 384
goal_dim: 512
obs_seq_len: 1
act_seq_len: 10
multistep: 10
p_last_state: 0
gen_img_res: 112
max_epochs: 800
rollout_lh_skip_epochs: 99999
window_sampling_strategy: 'geometric'
num_tokens_voltron: 3
num_workers: 16
img_gen_frame_diff: 3
use_extracted_rel_actions: true
norm_action_type: "mean"  # ori:minmax
benchmark_name: calvin_d


trainer:
  gpus: ${devices}
  precision: bf16
  max_epochs: ${max_epochs}
  sync_batchnorm: false
  accelerator: auto
  limit_train_batches: 1000
  limit_val_batches: 4
  enable_checkpointing: False  # our tcl callback will handle the checkpoints

logger:
  _target_: pytorch_lightning.loggers.WandbLogger
  save_dir: .
  name: logger
  group: edm_dp
  log_model: false
  project: ${benchmark_name} # calvin_vision
  entity: gavinyuan
  id: ???


hydra:
  run:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - log_dir
          - datamodule.root_data_dir
          - trainer.gpus
          - datamodule.num_workers
          - trainer.limit_train_batches
          - trainer.limit_val_batches
